<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计应26-4班课程表</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='white'%3E%E8%AF%BE%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container">

    <!-- 周选择视图 -->
    <div class="week-select-view" id="weekSelectView">
      <div class="header">
        <h1>计应26-4班课程表</h1>
        <p>2026–2027 学年第一学期 · 2026年9月7日开学 · 大一上</p>
      </div>
      <div class="week-grid" id="weekGrid"></div>
    </div>

    <!-- 课程表视图 -->
    <div class="schedule-view" id="scheduleView">
      <div class="top-bar">
        <button class="back-btn" onclick="showWeekSelect()">← 返回周选择</button>
        <div class="week-nav">
          <button class="nav-btn" id="prevWeek" onclick="changeWeek(-1)">上一周</button>
          <div class="week-title" id="weekTitle"></div>
          <button class="nav-btn" id="nextWeek" onclick="changeWeek(1)">下一周</button>
        </div>
        <div style="width:120px"></div>
      </div>
      <div class="schedule-scroll">
      <table class="schedule">
        <thead>
          <tr id="dayHeader"></tr>
        </thead>
        <tbody id="scheduleBody"></tbody>
      </table>
      </div>
    </div>
  </div>

  <!-- 课程详情弹窗 -->
  <div class="modal-mask" id="modalMask" onclick="closeModal(event)">
    <div class="modal">
      <h3 id="modalTitle"></h3>
      <p id="modalInfo"></p>
      <button class="close-btn" onclick="closeModal()">关闭</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/courses.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
