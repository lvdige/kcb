<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计应26-4班课程表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 50%, #e0e7ff 100%);
    min-height: 100vh;
    color: #1e293b;
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  /* ===== 周选择页面 ===== */
  .week-select-view { padding: 20px 0; }
  .header {
    text-align: center;
    margin-bottom: 30px;
  }
  .header h1 {
    font-size: 28px;
    color: #1e40af;
    margin-bottom: 8px;
  }
  .header p { color: #64748b; font-size: 14px; }
  .week-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .week-btn {
    background: #fff;
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    padding: 18px 12px;
    cursor: pointer;
    transition: all 0.25s;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .week-btn:hover {
    border-color: #3b82f6;
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(59,130,246,0.15);
  }
  .week-btn.current {
    border-color: #3b82f6;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: #fff;
  }
  .week-btn.current .week-date { color: rgba(255,255,255,0.85); }
  .week-num { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .week-date { font-size: 12px; color: #94a3b8; }
  .week-tag {
    display: inline-block;
    margin-top: 8px;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    background: #fef3c7;
    color: #92400e;
  }
  .week-btn.current .week-tag { background: rgba(255,255,255,0.25); color: #fff; }

  /* ===== 课程表页面 ===== */
  .schedule-view { display: none; }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .back-btn {
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
    font-size: 14px;
    color: #334155;
    transition: all 0.2s;
  }
  .back-btn:hover { background: #f1f5f9; }
  .week-nav { display: flex; gap: 8px; align-items: center; }
  .nav-btn {
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
  .nav-btn:hover:not(:disabled) { background: #eff6ff; border-color: #3b82f6; }
  .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .week-title { font-size: 18px; font-weight: 700; color: #1e40af; min-width: 140px; text-align: center; }

  table.schedule {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  table.schedule th, table.schedule td {
    border: 1px solid #e2e8f0;
    padding: 0;
    text-align: center;
    vertical-align: middle;
  }
  table.schedule thead th {
    background: #f8fafc;
    padding: 14px 6px;
    font-size: 14px;
    font-weight: 600;
    color: #475569;
  }
  table.schedule thead th.today { background: #dbeafe; color: #1e40af; }
  .period-col { width: 60px; background: #f8fafc; }
  .period-label { font-size: 12px; color: #64748b; font-weight: 600; }
  .period-time { font-size: 10px; color: #94a3b8; margin-top: 2px; }
  .course-cell { height: 70px; padding: 6px !important; }
  .course-block {
    border-radius: 8px;
    padding: 8px 6px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    transition: transform 0.15s;
    color: #fff;
    font-size: 12px;
    line-height: 1.4;
  }
  .course-block:hover { transform: scale(1.03); opacity: 0.92; }
  .course-name { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
  .course-loc { font-size: 11px; opacity: 0.9; }
  .course-teacher { font-size: 10px; opacity: 0.8; margin-top: 2px; }
  .empty-cell { background: #fcfdfe; }

  /* 课程配色 */
  .c-blue   { background: linear-gradient(135deg,#3b82f6,#2563eb); }
  .c-green  { background: linear-gradient(135deg,#10b981,#059669); }
  .c-orange { background: linear-gradient(135deg,#f59e0b,#d97706); }
  .c-pink   { background: linear-gradient(135deg,#ec4899,#db2777); }
  .c-purple { background: linear-gradient(135deg,#8b5cf6,#7c3aed); }
  .c-cyan   { background: linear-gradient(135deg,#06b6d4,#0891b2); }
  .c-red    { background: linear-gradient(135deg,#ef4444,#dc2626); }
  .c-indigo { background: linear-gradient(135deg,#6366f1,#4f46e5); }
  .c-teal   { background: linear-gradient(135deg,#14b8a6,#0d9488); }
  .c-amber  { background: linear-gradient(135deg,#f97316,#ea580c); }

  /* 弹窗 */
  .modal-mask {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    max-width: 360px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .modal h3 { margin-bottom: 12px; color: #1e40af; }
  .modal p { margin: 6px 0; font-size: 14px; color: #475569; }
  .modal .close-btn {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }

  @media (max-width: 768px) {
    .container { padding: 10px; }
    .header h1 { font-size: 22px; }
    .week-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
    .week-btn { padding: 12px 6px; }
    .week-num { font-size: 16px; }
    .course-name { font-size: 11px; }
    .course-loc, .course-teacher { font-size: 9px; }
    .period-col { width: 40px; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- 周选择视图 -->
  <div class="week-select-view" id="weekSelectView">
    <div class="header">
      <h1>计应26-4班课程表</h1>
      <p>2026–2027 学年第一学期 · 2026年9月7日开学 · 大一上</p>
    </div>
    <div class="week-grid" id="weekGrid"></div>
  </div>

  <!-- 课程表视图 -->
  <div class="schedule-view" id="scheduleView">
    <div class="top-bar">
      <button class="back-btn" onclick="showWeekSelect()">← 返回周选择</button>
      <div class="week-nav">
        <button class="nav-btn" id="prevWeek" onclick="changeWeek(-1)">上一周</button>
        <div class="week-title" id="weekTitle"></div>
        <button class="nav-btn" id="nextWeek" onclick="changeWeek(1)">下一周</button>
      </div>
      <div style="width:120px"></div>
    </div>
    <table class="schedule">
      <thead>
        <tr id="dayHeader"></tr>
      </thead>
      <tbody id="scheduleBody"></tbody>
    </table>
  </div>
</div>

<!-- 课程详情弹窗 -->
<div class="modal-mask" id="modalMask" onclick="closeModal(event)">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <p id="modalInfo"></p>
    <button class="close-btn" onclick="closeModal()">关闭</button>
  </div>
</div>

<script>
// ===== 学期配置 =====
const SEMESTER_START = new Date(2026, 8, 7); // 2026-09-07 周一（月份从0开始）
const TOTAL_WEEKS = 20;

// ===== 节次时间 =====
const PERIODS = [
  { num: 1, time: "08:40~9:20" },
  { num: 2, time: "09:25~10:05" },
  { num: 3, time: "10:25~11:05" },
  { num: 4, time: "11:10~11:50" },
  { num: 5, time: "14:30~15:10" },
  { num: 6, time: "15:15~15:55" },
  { num: 7, time: "16:05~16:45" },
  { num: 8, time: "16:50~17:30" },
  { num: 9, time: "19:30~20:10" },
  { num: 10, time: "20:15~20:55" },
  { num: 11, time: "21:00~20:40" },
];

// ===== 课程事件数据 =====
// day: 1=周一, 2=周二, ... 7=周日
const EVENTS = [
  // 常规课程
  { summary: "综合英语", day: 1, startSec: 5, endSec: 6, firstDate: "2026-10-05", lastDate: "2026-12-27", location: "8103D", teacher: "潘晨云" },
  { summary: "体育（一）", day: 1, startSec: 7, endSec: 8, firstDate: "2026-10-05", lastDate: "2026-12-13", location: "", teacher: "" },

  { summary: "网页设计", day: 1, startSec: 3, endSec: 4, firstDate: "2026-10-12", lastDate: "2027-01-03", location: "7307J", teacher: "曾秋玲" },
  { summary: "C语言程序设计", day: 1, startSec: 9, endSec: 11, firstDate: "2026-10-12", lastDate: "2026-12-06", location: "A508J", teacher: "廖江福" },
  { summary: "计算机导论", day: 2, startSec: 1, endSec: 2, firstDate: "2026-10-13", lastDate: "2027-01-04", location: "A201J", teacher: "涂志军" },
  { summary: "军事理论", day: 2, startSec: 3, endSec: 4, firstDate: "2026-10-13", lastDate: "2026-12-21", location: "8308D", teacher: "徐秋梦" },
  { summary: "应用高等数学B", day: 2, startSec: 7, endSec: 8, firstDate: "2026-10-06", lastDate: "2027-01-11", location: "8203D", teacher: "陈德健" },
  { summary: "C语言程序设计", day: 2, startSec: 9, endSec: 11, firstDate: "2026-11-10", lastDate: "2027-01-04", location: "A201J", teacher: "廖江福" },

  { summary: "网页设计", day: 3, startSec: 1, endSec: 2, firstDate: "2026-10-14", lastDate: "2027-01-05", location: "7307J", teacher: "曾秋玲" },
  { summary: "应用高等数学B", day: 3, startSec: 3, endSec: 4, firstDate: "2026-10-07", lastDate: "2027-01-12", location: "8106D", teacher: "陈德健" },
  { summary: "思想道德与法治（一）", day: 3, startSec: 5, endSec: 6, firstDate: "2026-10-07", lastDate: "2026-12-29", location: "8303D", teacher: "李德先" },
  { summary: "形势与政策（一）", day: 3, startSec: 5, endSec: 6, firstDate: "2026-12-30", lastDate: "2027-01-12", location: "8303D", teacher: "李德先" },
  { summary: "创新创业基础与实践（一）", day: 3, startSec: 9, endSec: 10, firstDate: "2026-10-14", lastDate: "2026-11-10", location: "8108D", teacher: "潘显鹏" },
  { summary: "职业发展与就业指导（一）", day: 3, startSec: 9, endSec: 10, firstDate: "2026-11-11", lastDate: "2026-12-08", location: "8206D", teacher: "蒋彩梅" },

  { summary: "计算机导论", day: 4, startSec: 1, endSec: 2, firstDate: "2026-10-15", lastDate: "2027-01-06", location: "A201J", teacher: "涂志军" },
  { summary: "综合英语", day: 4, startSec: 7, endSec: 8, firstDate: "2026-10-08", lastDate: "2026-12-30", location: "8103D", teacher: "潘晨云" },

  { summary: "大学生心理健康教育（一）", day: 5, startSec: 3, endSec: 4, firstDate: "2026-10-16", lastDate: "2026-12-10", location: "8201D", teacher: "潘显鹏" },
  { summary: "应用高等数学B", day: 5, startSec: 3, endSec: 4, firstDate: "2026-12-18", lastDate: "2027-01-14", location: "8203D", teacher: "陈德健" },

  // 集中实训周
  { summary: "计算机组装与维护实训", day: 1, startSec: 1, endSec: 11, firstDate: "2027-01-04", lastDate: "2027-01-04", location: "A409J", teacher: "涂志军、廖江福" },
  { summary: "计算机组装与维护实训", day: 2, startSec: 9, endSec: 11, firstDate: "2027-01-05", lastDate: "2027-01-05", location: "A409J", teacher: "涂志军、廖江福" },
  { summary: "计算机组装与维护实训", day: 3, startSec: 9, endSec: 11, firstDate: "2027-01-06", lastDate: "2027-01-06", location: "A409J", teacher: "涂志军、廖江福" },
  { summary: "计算机组装与维护实训", day: 4, startSec: 1, endSec: 4, firstDate: "2027-01-07", lastDate: "2027-01-07", location: "A409J", teacher: "涂志军、廖江福" },
  { summary: "计算机组装与维护实训", day: 4, startSec: 9, endSec: 11, firstDate: "2027-01-07", lastDate: "2027-01-07", location: "A409J", teacher: "涂志军、廖江福" },

  { summary: "网站设计实训", day: 1, startSec: 1, endSec: 8, firstDate: "2027-01-11", lastDate: "2027-01-11", location: "7303J", teacher: "曾秋玲" },
  { summary: "网站设计实训", day: 2, startSec: 1, endSec: 4, firstDate: "2027-01-12", lastDate: "2027-01-12", location: "7303J", teacher: "曾秋玲" },
  { summary: "网站设计实训", day: 3, startSec: 1, endSec: 8, firstDate: "2027-01-13", lastDate: "2027-01-13", location: "7303J", teacher: "曾秋玲" },
  { summary: "网站设计实训", day: 4, startSec: 9, endSec: 11, firstDate: "2027-01-14", lastDate: "2027-01-14", location: "7303J", teacher: "曾秋玲" },
];

// 课程配色映射
const COLOR_MAP = {};
const COLORS = ["c-blue","c-green","c-orange","c-pink","c-purple","c-cyan","c-red","c-indigo","c-teal","c-amber"];
let colorIdx = 0;
function getColor(name) {
  if (!COLOR_MAP[name]) {
    COLOR_MAP[name] = COLORS[colorIdx % COLORS.length];
    colorIdx++;
  }
  return COLOR_MAP[name];
}

// ===== 工具函数 =====
function parseDate(s) {
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function formatDate(d) {
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function getWeekMonday(weekNum) {
  const d = new Date(SEMESTER_START);
  d.setDate(d.getDate() + (weekNum-1)*7);
  return d;
}
function eventInWeek(ev, weekNum) {
  // 该周周一的日期
  const weekMon = getWeekMonday(weekNum);
  // 该周对应星期几的日期
  const evDate = new Date(weekMon);
  evDate.setDate(evDate.getDate() + (ev.day - 1));
  const first = parseDate(ev.firstDate);
  const last = parseDate(ev.lastDate);
  return evDate >= first && evDate <= last;
}

// ===== 当前周计算 =====
function getCurrentWeek() {
  const now = new Date();
  const diff = Math.floor((now - SEMESTER_START) / (7*24*60*60*1000));
  let w = diff + 1;
  if (w < 1) w = 1;
  if (w > TOTAL_WEEKS) w = TOTAL_WEEKS;
  return w;
}

let currentWeek = 1;

// ===== 渲染周选择页 =====
function renderWeekGrid() {
  const grid = document.getElementById("weekGrid");
  const cur = getCurrentWeek();
  let html = "";
  for (let w = 1; w <= TOTAL_WEEKS; w++) {
    const mon = getWeekMonday(w);
    const sun = new Date(mon);
    sun.setDate(sun.getDate() + 6);
    const isCur = w === cur;
    let tag = "";
    // 标记实训周
    if (w === 18) tag = '<span class="week-tag">计算机组装实训</span>';
    if (w === 19) tag = '<span class="week-tag">网站设计实训</span>';
    html += `
      <div class="week-btn ${isCur?'current':''}" onclick="selectWeek(${w})">
        <div class="week-num">第 ${w} 周</div>
        <div class="week-date">${formatDate(mon)} - ${formatDate(sun)}</div>
        ${tag}
      </div>`;
  }
  grid.innerHTML = html;
}

// ===== 渲染课程表 =====
function renderSchedule(weekNum) {
  currentWeek = weekNum;
  const mon = getWeekMonday(weekNum);
  const sun = new Date(mon);
  sun.setDate(sun.getDate() + 6);
  document.getElementById("weekTitle").textContent = `第 ${weekNum} 周`;
  document.getElementById("prevWeek").disabled = weekNum <= 1;
  document.getElementById("nextWeek").disabled = weekNum >= TOTAL_WEEKS;

  // 表头
  const dayNames = ["周一","周二","周三","周四","周五","周六","周日"];
  const today = new Date();
  let headerHtml = '<th class="period-col">节次</th>';
  for (let d = 0; d < 5; d++) {
    const dayDate = new Date(mon);
    dayDate.setDate(dayDate.getDate() + d);
    const isToday = today.toDateString() === dayDate.toDateString();
    headerHtml += `<th class="${isToday?'today':''}">${dayNames[d]}<br><span style="font-size:11px;font-weight:400;color:#94a3b8">${dayDate.getMonth()+1}/${dayDate.getDate()}</span></th>`;
  }
  document.getElementById("dayHeader").innerHTML = headerHtml;

  // 构建课程查找表：key = day_sec, value = event
  const cellMap = {}; // {day_sec: ev}
  EVENTS.forEach(ev => {
    if (eventInWeek(ev, weekNum)) {
      for (let s = ev.startSec; s <= ev.endSec; s++) {
        cellMap[`${ev.day}_${s}`] = ev;
      }
    }
  });

  // 表体
  let bodyHtml = "";
  PERIODS.forEach(p => {
    bodyHtml += `<tr><td class="period-col"><div class="period-label">第${p.num}节</div><div class="period-time">${p.time}</div></td>`;
    for (let d = 1; d <= 5; d++) {
      const ev = cellMap[`${d}_${p.num}`];
      if (ev) {
        // 只在课程开始节次渲染block
        if (ev.startSec === p.num) {
          const rowSpan = ev.endSec - ev.startSec + 1;
          bodyHtml += `<td class="course-cell" rowspan="${rowSpan}">
            <div class="course-block ${getColor(ev.summary)}" onclick='showModal(${JSON.stringify(ev).replace(/'/g,"&#39;")})'>
              <div class="course-name">${ev.summary}</div>
              ${ev.location ? `<div class="course-loc">📍 ${ev.location}</div>` : ''}
              ${ev.teacher ? `<div class="course-teacher">👨‍🏫 ${ev.teacher}</div>` : ''}
            </div>
          </td>`;
        }
        // 否则不输出td（被rowspan占了）
      } else {
        bodyHtml += `<td class="course-cell empty-cell"></td>`;
      }
    }
    bodyHtml += `</tr>`;
  });
  document.getElementById("scheduleBody").innerHTML = bodyHtml;
}

// ===== 视图切换 =====
function showWeekSelect() {
  document.getElementById("weekSelectView").style.display = "block";
  document.getElementById("scheduleView").style.display = "none";
}
function selectWeek(w) {
  document.getElementById("weekSelectView").style.display = "none";
  document.getElementById("scheduleView").style.display = "block";
  renderSchedule(w);
}
function changeWeek(delta) {
  const w = currentWeek + delta;
  if (w >= 1 && w <= TOTAL_WEEKS) renderSchedule(w);
}

// ===== 弹窗 =====
function showModal(ev) {
  document.getElementById("modalTitle").textContent = ev.summary;
  document.getElementById("modalInfo").innerHTML = `
    <p><strong>节次：</strong>第${ev.startSec} - ${ev.endSec}节</p>
    <p><strong>教室：</strong>${ev.location || "待定"}</p>
    <p><strong>老师：</strong>${ev.teacher}</p>
  `;
  document.getElementById("modalMask").classList.add("show");
}
function closeModal(e) {
  if (e && e.target.id !== "modalMask" && e.type === "click" && e.currentTarget.id !== "modalMask") {
    // 点击modal内部不关闭
  }
  document.getElementById("modalMask").classList.remove("show");
}

// ===== 初始化 =====
renderWeekGrid();
// 默认定位到当前周
// selectWeek(getCurrentWeek()); // 默认先显示周选择页
</script>
</body>
</html>
